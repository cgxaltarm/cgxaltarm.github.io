<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyFlo Key Dashboard</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 40px auto; background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { font-size: 20px; margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
    input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 10px; border-radius: 6px; border: none; background: #3b82f6; color: #fff; font-weight: bold; cursor: pointer; }
    button:hover { background: #2563eb; }
    .info-card { background: #0f172a; padding: 16px; border-radius: 8px; margin-bottom: 12px; }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
    .hidden { display: none; }
    .error { color: #ef4444; font-size: 14px; margin-top: 10px; text-align: center; }
    ul { padding-left: 20px; margin: 0; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>DailyFlo Key Dashboard</h1>

    <div id="login-view">
      <div class="form-group">
        <label for="api-key">Enter Managed API Key</label>
        <input type="password" id="api-key" placeholder="df_live_..." />
      </div>
      <button onclick="login()">View Usage & Key Info</button>
      <div id="login-error" class="error"></div>
    </div>

    <div id="dashboard-view" class="hidden">
      <div class="info-card">
        <div class="info-row"><span>Label:</span><strong id="key-label">-</strong></div>
        <div class="info-row"><span>Status:</span><strong id="key-status">-</strong></div>
        <div class="info-row"><span>Tokens Used:</span><strong id="key-used">-</strong></div>
        <div class="info-row"><span>Remaining Tokens:</span><strong id="key-remaining">-</strong></div>
      </div>

      <div class="info-card">
        <label>Allowed Models</label>
        <ul id="allowed-models"></ul>
      </div>

      <button onclick="logout()" style="background: #475569; margin-top: 10px;">Logout</button>
    </div>
  </div>

  <script>
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://127.0.0.1:20128'
      : 'https://ai.dailyflo.me';

    async function checkSession() {
      try {
        const res = await fetch(`${API_BASE}/api/key-dashboard/info`, { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          showDashboard(data);
        }
      } catch (e) {}
    }

    async function login() {
      const key = document.getElementById('api-key').value.trim();
      const errorDiv = document.getElementById('login-error');
      errorDiv.innerText = '';
      if (!key) return;

      try {
        const res = await fetch(`${API_BASE}/api/key-dashboard/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key }),
          credentials: 'include',
        });
        const data = await res.json();
        if (!res.ok) {
          errorDiv.innerText = data.error?.message || 'Login failed';
          return;
        }
        checkSession();
      } catch (e) {
        errorDiv.innerText = 'Network error';
      }
    }

    function showDashboard(data) {
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('dashboard-view').classList.remove('hidden');

      document.getElementById('key-label').innerText = data.label;
      document.getElementById('key-status').innerText = data.status;
      document.getElementById('key-used').innerText = data.tokensUsed.toLocaleString();
      document.getElementById('key-remaining').innerText = data.remainingTokens !== null ? data.remainingTokens.toLocaleString() : 'Unlimited';

      const modelsList = document.getElementById('allowed-models');
      modelsList.innerHTML = '';
      (data.allowedModels || []).forEach(m => {
        const li = document.createElement('li');
        li.innerText = m;
        modelsList.appendChild(li);
      });
    }

    function logout() {
      document.cookie = "df_session=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
      document.getElementById('dashboard-view').classList.add('hidden');
      document.getElementById('login-view').classList.remove('hidden');
    }

    checkSession();
  </script>
</body>
</html>
