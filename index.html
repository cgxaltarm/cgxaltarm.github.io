<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f0f">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Pemakaian token dan biaya model DailyFlo secara langsung.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dailyflo.me/">
    <meta property="og:title" content="DailyFlo Usage Monitor">
    <meta property="og:description" content="USD + token per model, langsung dari DailyFlo.">
    <meta property="og:image" content="https://dailyflo.me/og.png">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/src/style.css">
    <title>DailyFlo Usage Monitor</title>
  </head>
  <body class="embed-page">
    <header class="embed-header">
      <a class="brand" href="/" aria-label="DailyFlo Usage Monitor">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span><strong>DailyFlo</strong><small>usage monitor</small></span>
      </a>
      <span class="status">Live · baca saja</span>
    </header>

    <main class="embed-main">
      <div class="embed-title">
        <div>
          <p class="eyebrow">LIVE · USD + TOKEN</p>
          <h1>Pemakaian model DailyFlo</h1>
        </div>
        <p>Hanya ringkasan, grafik, dan tabel model yang ditampilkan. Navigasi serta pengaturan dinonaktifkan.</p>
      </div>

      <section class="usage-panels" aria-label="Statistik penggunaan DailyFlo">
        <div class="usage-crop usage-summary">
          <iframe
            src="https://api.dailyflo.me/dashboard/usage"
            title="Ringkasan penggunaan DailyFlo"
            sandbox="allow-scripts allow-same-origin"
            tabindex="-1"
          ></iframe>
        </div>
        <div class="usage-crop usage-chart">
          <iframe
            src="https://api.dailyflo.me/dashboard/usage"
            title="Grafik penggunaan DailyFlo"
            sandbox="allow-scripts allow-same-origin"
            tabindex="-1"
          ></iframe>
        </div>
        <div class="usage-crop usage-models">
          <iframe
            src="https://api.dailyflo.me/dashboard/usage"
            title="Tabel penggunaan per model DailyFlo"
            sandbox="allow-scripts allow-same-origin"
            tabindex="-1"
          ></iframe>
        </div>
      </section>
    </main>
  </body>
</html>
